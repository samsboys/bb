<script>

/* ==================================================
   ★★★ 비밀번호 설정 ★★★
================================================== */

/*
   일반 사용자 접속 비밀번호
*/
const PAGE_PASSWORD = "7216";


/*
   관리자 비밀번호
*/
const ADMIN_PASSWORD = "7979";


/*
   관리자 Google Sheets 주소
*/
const ADMIN_URL =
"https://docs.google.com/spreadsheets/d/1eQHscrZpAWzrOo6QJw3pmyoeUijUoTKyfMmmPRPqkaU/edit?gid=1237649201#gid=1237649201";


/* ==================================================
   저장 이름
================================================== */

const PAGE_REMEMBER_KEY =
"bukbu_page_remember";

const ADMIN_REMEMBER_KEY =
"bukbu_admin_remember";


/* ==================================================
   일반 로그인 요소
================================================== */

const loginOverlay =
document.getElementById("loginOverlay");

const loginPassword =
document.getElementById("loginPassword");

const rememberLogin =
document.getElementById("rememberLogin");

const loginButton =
document.getElementById("loginButton");

const loginError =
document.getElementById("loginError");


/* ==================================================
   관리자 로그인 요소
================================================== */

const adminOverlay =
document.getElementById("adminOverlay");

const adminPassword =
document.getElementById("adminPassword");

const rememberAdmin =
document.getElementById("rememberAdmin");

const adminLoginButton =
document.getElementById("adminLoginButton");

const adminError =
document.getElementById("adminError");


/* ==================================================
   저장값 확인
================================================== */

function pageRemembered() {

    try {

        return localStorage.getItem(
            PAGE_REMEMBER_KEY
        ) === "yes";

    } catch (e) {

        return false;

    }
}


function adminRemembered() {

    try {

        return localStorage.getItem(
            ADMIN_REMEMBER_KEY
        ) === "yes";

    } catch (e) {

        return false;

    }
}


/* ==================================================
   메인 페이지 열기
================================================== */

function unlockPage() {

    document.body.classList.add(
        "unlocked"
    );

    loginOverlay.style.display =
        "none";

}


/* ==================================================
   일반 비밀번호 확인
================================================== */

function checkLoginPassword() {

    const password =
        loginPassword.value.trim();


    if (!password) {

        loginError.textContent =
            "비밀번호를 입력해 주세요.";

        loginPassword.focus();

        return;
    }


    if (password !== PAGE_PASSWORD) {

        loginError.textContent =
            "비밀번호가 올바르지 않습니다.";

        loginPassword.value = "";

        loginPassword.focus();

        return;
    }


    /* 기억하기 */

    if (rememberLogin.checked) {

        try {

            localStorage.setItem(
                PAGE_REMEMBER_KEY,
                "yes"
            );

        } catch (e) {}

    } else {

        try {

            localStorage.removeItem(
                PAGE_REMEMBER_KEY
            );

        } catch (e) {}

    }


    unlockPage();
}


/* ==================================================
   일반 로그인 버튼
================================================== */

loginButton.addEventListener(
    "click",
    checkLoginPassword
);


/* ==================================================
   일반 로그인 Enter
================================================== */

loginPassword.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            checkLoginPassword();

        }

    }
);


/* ==================================================
   관리자 창 열기
================================================== */

function openAdminLogin() {

    /*
       관리자 비밀번호를 기억한 경우
       바로 관리자 페이지로 이동
    */

    if (adminRemembered()) {

        window.location.href =
            ADMIN_URL;

        return;
    }


    adminPassword.value = "";

    adminError.textContent = "";

    rememberAdmin.checked = false;

    adminOverlay.classList.add("show");

    setTimeout(
        function() {

            adminPassword.focus();

        },
        100
    );
}


/* ==================================================
   관리자 비밀번호 확인
================================================== */

function checkAdminPassword() {

    const password =
        adminPassword.value.trim();


    if (!password) {

        adminError.textContent =
            "관리자 비밀번호를 입력해 주세요.";

        adminPassword.focus();

        return;
    }


    if (password !== ADMIN_PASSWORD) {

        adminError.textContent =
            "관리자 비밀번호가 올바르지 않습니다.";

        adminPassword.value = "";

        adminPassword.focus();

        return;
    }


    /*
       관리자 비밀번호 기억
    */

    if (rememberAdmin.checked) {

        try {

            localStorage.setItem(
                ADMIN_REMEMBER_KEY,
                "yes"
            );

        } catch (e) {}

    } else {

        try {

            localStorage.removeItem(
                ADMIN_REMEMBER_KEY
            );

        } catch (e) {}

    }


    /*
       관리자 페이지 이동
    */

    window.location.href =
        ADMIN_URL;
}


/* ==================================================
   관리자 버튼
================================================== */

document.getElementById(
    "adminButton"
).addEventListener(
    "click",
    openAdminLogin
);


/* ==================================================

================================================== */

adminLoginButton.addEventListener(

);


/* ==================================================

================================================== */

adminPassword.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            checkAdminPassword();

        }

    }
);

window.addEventListener(

        /*

        if (pageRemembered()) {
