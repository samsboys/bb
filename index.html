/* ==================================================

* {

}

body.unlocked .page {
    display: block;
}


/* ==================================================
   가운데 영역
================================================== */

.container {
    width: 100%;
    max-width: 760px;

/* ==================================================
   제목
================================================== */

}

/* ==================================================
   메인 게시판
================================================== */

.main-link {

}

.main-content {
    display: flex;

    align-items: center;

    gap: 16px;

    min-width: 0;
}

.main-icon {
    width: 54px;
    height: 54px;

    flex: 0 0 auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 17px;

    background: rgba(255,255,255,0.17);

    font-size: 27px;
}

.main-title {
    font-size: 25px;
    font-weight: 800;

    letter-spacing: -0.7px;
}

.arrow {
    flex: 0 0 auto;

    font-size: 30px;
    font-weight: 300;

    opacity: 0.9;

/* ==================================================
   버튼 영역
================================================== */

.buttons {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;

    margin-top: 16px;

/* ==================================================
   일반 버튼
================================================== */

.button {
    display: flex;

    align-items: center;
    justify-content: space-between;

    min-height: 92px;

    padding: 17px;

    text-decoration: none;

    color: #172033;

    background: #ffffff;

    cursor: pointer;

.button-left {

    gap: 12px;

.icon {

<script>

/* ==================================================
   관리자 메뉴
================================================== */

const adminMenuOverlay =
    document.getElementById("adminMenuOverlay");

const adminMenuClose =
    document.getElementById("adminMenuClose");

function showAdminMenu() {
    if (!adminMenuOverlay) return;
    if (adminOverlay) {
        adminOverlay.classList.remove("show");
    }
    adminMenuOverlay.classList.add("show");
}

function closeAdminMenu() {
    if (!adminMenuOverlay) return;
    adminMenuOverlay.classList.remove("show");
}

if (adminMenuClose) {
    adminMenuClose.addEventListener(
        "click",
        closeAdminMenu
    );
}

if (adminMenuOverlay) {
    adminMenuOverlay.addEventListener(
        "click",
        function(event) {
            if (event.target === adminMenuOverlay) {
                closeAdminMenu();
            }
        }
    );
}


/* ==================================================
   비밀번호 설정
================================================== */

const PAGE_PASSWORD = "7216";

const ADMIN_PASSWORD = "7979";


/* ==================================================
   관리자 Google Sheets 주소

   ★ 수정:
   ?gid=1237649201#gid=1237649201
   →
   #gid=1237649201
================================================== */

const ADMIN_URL =
"https://docs.google.com/spreadsheets/d/1eQHscrZpAWzrOo6QJw3pmyoeUijUoTKyfMmmPRPqkaU/edit#gid=1237649201";


/* ==================================================
   기억하기 저장 키
================================================== */

const PAGE_REMEMBER_KEY =
"bukbu_page_remember";

const ADMIN_REMEMBER_KEY =
"bukbu_admin_remember";


/* ==================================================
   일반 로그인 요소
================================================== */

const loginOverlay =
document.getElementById("loginOverlay");

const loginPassword =
document.getElementById("loginPassword");

const rememberLogin =
document.getElementById("rememberLogin");

const loginButton =
document.getElementById("loginButton");

const loginError =
document.getElementById("loginError");

const loginCancelButton =
document.getElementById("loginCancelButton");


/* ==================================================
   관리자 로그인 요소
================================================== */

const adminOverlay =
document.getElementById("adminOverlay");

const adminPassword =
document.getElementById("adminPassword");

const rememberAdmin =
document.getElementById("rememberAdmin");

const adminLoginButton =
document.getElementById("adminLoginButton");

const adminError =
document.getElementById("adminError");

const adminCancelButton =
document.getElementById("adminCancelButton");


/* ==================================================
   일반 비밀번호 기억 여부
================================================== */

function pageRemembered() {

    try {

        return localStorage.getItem(
            PAGE_REMEMBER_KEY
        ) === "yes";

    } catch (error) {

        return false;

    }

}


/* ==================================================
   관리자 비밀번호 기억 여부
================================================== */

function adminRemembered() {

    try {

        return localStorage.getItem(
            ADMIN_REMEMBER_KEY
        ) === "yes";

    } catch (error) {

        return false;

    }

}


/* ==================================================
   메인 페이지 열기
================================================== */

function unlockPage() {

    document.body.classList.add(
        "unlocked"
    );

    loginOverlay.classList.add(
        "hidden"
    );

}


/* ==================================================
   일반 비밀번호 확인
================================================== */

function checkLoginPassword() {

    const password =
        loginPassword.value.trim();


    if (!password) {

        loginError.textContent =
            "비밀번호를 입력해 주세요.";

        loginPassword.focus();

        return;

    }


    if (password !== PAGE_PASSWORD) {

        loginError.textContent =
            "비밀번호가 올바르지 않습니다.";

        loginPassword.value = "";

        loginPassword.focus();

        return;

    }


    if (rememberLogin.checked) {

        try {

            localStorage.setItem(
                PAGE_REMEMBER_KEY,
                "yes"
            );

        } catch (error) {

            console.log(
                "비밀번호 저장 실패",
                error
            );

        }

    } else {

        try {

            localStorage.removeItem(
                PAGE_REMEMBER_KEY
            );

        } catch (error) {}

    }


    unlockPage();

}


/* ==================================================
   일반 로그인 버튼
================================================== */

loginButton.addEventListener(
    "click",
    checkLoginPassword
);


/* ==================================================
   일반 로그인 취소
================================================== */

function cancelLogin() {

    const referrer =
        document.referrer;

    if (
        referrer &&
        referrer !== window.location.href
    ) {

        window.location.replace(referrer);

        return;
    }


    if (window.history.length > 1) {

        window.history.back();

        return;
    }


    loginPassword.value = "";

    loginError.textContent = "";

}

loginCancelButton.addEventListener(
    "click",
    cancelLogin
);


/* ==================================================
   일반 로그인 Enter
================================================== */

loginPassword.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            checkLoginPassword();

        }

    }
);


/* ==================================================
   관리자 로그인 창 열기
================================================== */

function openAdminLogin() {

    if (adminRemembered()) {

        showAdminMenu();

        return;

    }


    adminPassword.value = "";

    adminError.textContent = "";

    rememberAdmin.checked = false;


    adminOverlay.classList.add(
        "show"
    );


    setTimeout(
        function() {

            adminPassword.focus();

        },
        100
    );

}


/* ==================================================
   관리자 비밀번호 확인
================================================== */

function checkAdminPassword() {

    const password =
        adminPassword.value.trim();


    if (!password) {

        adminError.textContent =
            "관리자 비밀번호를 입력해 주세요.";

        adminPassword.focus();

        return;

    }


    if (password !== ADMIN_PASSWORD) {

        adminError.textContent =
            "관리자 비밀번호가 올바르지 않습니다.";

        adminPassword.value = "";

        adminPassword.focus();

        return;

    }


    if (rememberAdmin.checked) {

        try {

            localStorage.setItem(
                ADMIN_REMEMBER_KEY,
                "yes"
            );

        } catch (error) {

            console.log(
                "관리자 비밀번호 저장 실패",
                error
            );

        }

    } else {

        try {

            localStorage.removeItem(
                ADMIN_REMEMBER_KEY
            );

        } catch (error) {}

    }


    showAdminMenu();

}


/* ==================================================
   관리자 버튼
================================================== */

document.getElementById(
    "adminButton"
).addEventListener(
    "click",
    openAdminLogin
);


/* ==================================================
   관리자 확인
================================================== */

adminLoginButton.addEventListener(
    "click",
    checkAdminPassword
);


/* ==================================================
   관리자 취소
================================================== */

function cancelAdminLogin() {

    adminOverlay.classList.remove(
        "show"
    );

    adminPassword.value = "";

    adminError.textContent = "";

}

adminCancelButton.addEventListener(
    "click",
    cancelAdminLogin
);


/* ==================================================
   관리자 Enter
================================================== */

adminPassword.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            checkAdminPassword();

        }

    }
);


/* ==================================================
   페이지 최초 실행
================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        const userAgent =
            navigator.userAgent || "";

        const isKakaoTalk =
            /KAKAOTALK|KakaoTalk/i.test(
                userAgent
            );


        /*
           PC/일반 브라우저에서는
           '이 기기에서 기억하기' 사용 가능

           카카오톡에서는
           매번 비밀번호 표시
        */

        if (
            pageRemembered() &&
            !isKakaoTalk
        ) {

            unlockPage();

            return;

        }


        setTimeout(
            function() {

                loginPassword.focus();

            },
            250
        );

    }
);


/* ==================================================
   뒤로가기 / BFCache 대응
================================================== */

window.addEventListener(
    "pageshow",
    function(event) {

        if (event.persisted) {

            window.scrollTo(0, 0);

        }

    }
);

</script>

<script>
/*
 * GitHub Pages / 일반 브라우저 대응
 * localStorage 또는 선택적 기능에서 오류가 발생해도
 * 기본 페이지가 빈 화면으로 남지 않도록 합니다.
 */
window.addEventListener("error", function(event) {
    console.error("페이지 오류:", event.error || event.message);
});

window.addEventListener("unhandledrejection", function(event) {
    console.error("비동기 오류:", event.reason);
});
</script>


</body>
</html>
