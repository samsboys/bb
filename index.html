<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<!-- =========================
     기본 설정
========================= -->

<meta name="theme-color" content="#1976d2">

<meta name="description"
      content="서울 북부 회중 전자카드">

<meta name="mobile-web-app-capable"
      content="yes">

<meta name="application-name"
      content="북부전자카드">


<!-- =========================
     Android / PWA
========================= -->

<link rel="manifest" href="./manifest.json">

<link rel="icon"
      type="image/png"
      sizes="192x192"
      href="./icon-192.png">

<link rel="icon"
      type="image/png"
      sizes="512x512"
      href="./icon-512.png">


<!-- =========================
     iPhone / iPad
========================= -->

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta name="apple-mobile-web-app-title"
      content="북부전자카드">

<link rel="apple-touch-icon"
      sizes="192x192"
      href="./icon-192.png">


<title>서울 북부 회중</title>


<style>

/* =========================
   기본 초기화
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    margin: 0;
    padding: 0;
    background: #f3f6fa;
}

body {
    margin: 0;
    padding: 0;

    min-height: 100vh;
    min-height: 100dvh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;

    background: #f3f6fa;
    color: #172033;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}


/* =========================
   전체 페이지
========================= */

.page {
    width: 100%;

    min-height: 100vh;
    min-height: 100dvh;

    padding-top:
        max(28px, env(safe-area-inset-top));

    padding-right:
        max(16px, env(safe-area-inset-right));

    padding-bottom:
        max(32px, env(safe-area-inset-bottom));

    padding-left:
        max(16px, env(safe-area-inset-left));
}


/* =========================
   가운데 영역
========================= */

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}


/* =========================
   제목
========================= */

.header {
    padding: 8px 4px 20px;
}

.title {
    margin: 0;

    font-size: 34px;
    font-weight: 800;

    letter-spacing: -1.3px;
    line-height: 1.15;

    color: #102a43;
}


/* =========================
   메인 게시판
========================= */

.main-link {
    display: flex;

    align-items: center;
    justify-content: space-between;

    width: 100%;
    min-height: 108px;

    padding: 22px 24px;

    background:
        linear-gradient(
            135deg,
            #1976d2 0%,
            #0757b5 100%
        );

    color: #ffffff;

    text-decoration: none;

    border-radius: 24px;

    box-shadow:
        0 10px 28px rgba(7, 87, 181, 0.25);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;

    -webkit-user-select: none;
    user-select: none;
}

.main-content {
    display: flex;

    align-items: center;

    gap: 16px;

    min-width: 0;
}

.main-icon {
    width: 54px;
    height: 54px;

    flex: 0 0 auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 17px;

    background: rgba(255,255,255,0.17);

    font-size: 27px;
}

.main-title {
    font-size: 25px;
    font-weight: 800;

    letter-spacing: -0.7px;
}

.arrow {
    flex: 0 0 auto;

    font-size: 30px;
    font-weight: 300;

    opacity: 0.9;
}


/* =========================
   버튼 영역
========================= */

.buttons {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;

    margin-top: 16px;
}


/* =========================
   일반 버튼
========================= */

.button {
    display: flex;

    align-items: center;
    justify-content: space-between;

    min-height: 92px;

    padding: 17px;

    text-decoration: none;

    color: #172033;

    background: #ffffff;

    border: 1px solid #d9e2ec;

    border-radius: 20px;

    box-shadow:
        0 3px 12px rgba(16, 42, 67, 0.07);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;

    -webkit-user-select: none;
    user-select: none;
}

.button-left {
    display: flex;

    align-items: center;

    gap: 12px;

    min-width: 0;
}

.icon {
    flex: 0 0 auto;

    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    font-size: 21px;

    background: #e7f0ff;
}


/* =========================
   아이콘 배경
========================= */

.purple .icon {
    background: #e5efff;
}

.blue .icon {
    background: #e1ecff;
}

.gray .icon {
    background: #e8eef5;
}

.orange .icon {
    background: #e5efff;
}

.green .icon {
    background: #e3edff;
}


/* =========================
   버튼 글자
========================= */

.button-text {
    font-size: 18px;
    font-weight: 750;

    letter-spacing: -0.5px;

    white-space: nowrap;
}

.button-arrow {
    flex: 0 0 auto;

    font-size: 21px;

    color: #9db2c8;

    margin-left: 5px;
}


/* =========================
   관리자 버튼
========================= */

.admin-button {
    grid-column: 1 / -1;

    min-height: 76px;

    background:
        linear-gradient(
            135deg,
            #123f70 0%,
            #082b50 100%
        );

    color: #ffffff;

    border: none;

    box-shadow:
        0 7px 20px rgba(8, 43, 80, 0.20);
}

.admin-button .icon {
    background: rgba(255,255,255,0.13);
}

.admin-button .button-arrow {
    color: #a9c0d8;
}


/* =========================
   터치 효과
========================= */

.button:active,
.main-link:active {
    transform: scale(0.97);
}

.button:hover {
    box-shadow:
        0 6px 18px rgba(16, 42, 67, 0.11);
}

.main-link:hover {
    box-shadow:
        0 12px 32px rgba(7, 87, 181, 0.30);
}


/* =========================
   작은 휴대폰
========================= */

@media (max-width: 430px) {

    .page {
        padding-top:
            max(20px, env(safe-area-inset-top));

        padding-left:
            max(13px, env(safe-area-inset-left));

        padding-right:
            max(13px, env(safe-area-inset-right));
    }

    .header {
        padding-bottom: 17px;
    }

    .title {
        font-size: 31px;
    }

    .main-link {
        min-height: 100px;

        padding: 19px;

        border-radius: 21px;
    }

    .main-icon {
        width: 48px;
        height: 48px;

        border-radius: 15px;

        font-size: 24px;
    }

    .main-title {
        font-size: 22px;
    }

    .buttons {
        gap: 9px;

        margin-top: 13px;
    }

    .button {
        min-height: 84px;

        padding: 13px 12px;

        border-radius: 17px;
    }

    .button-left {
        gap: 9px;
    }

    .icon {
        width: 36px;
        height: 36px;

        border-radius: 11px;

        font-size: 18px;
    }

    .button-text {
        font-size: 16px;
    }

    .button-arrow {
        font-size: 18px;
    }

    .admin-button {
        min-height: 68px;
    }
}


/* =========================
   아주 작은 화면
========================= */

@media (max-width: 360px) {

    .title {
        font-size: 28px;
    }

    .main-title {
        font-size: 20px;
    }

    .button {
        min-height: 80px;
    }

    .button-text {
        font-size: 14px;
    }

    .icon {
        width: 33px;
        height: 33px;

        font-size: 16px;
    }
}


/* =========================
   가로 화면 방지 보정
========================= */

@media (orientation: landscape) and (max-height: 500px) {

    .page {
        padding-top: 18px;
        padding-bottom: 18px;
    }

    .header {
        padding-bottom: 12px;
    }

    .title {
        font-size: 27px;
    }

    .main-link {
        min-height: 78px;
    }

    .button {
        min-height: 70px;
    }
}

</style>
</head>

<script>

/* =========================
   Service Worker 등록
   Android PWA / 오프라인
========================= */

if ("serviceWorker" in navigator) {

    window.addEventListener("load", function () {

        navigator.serviceWorker
            .register("./sw.js")
            .then(function (registration) {

                console.log(
                    "Service Worker 등록 완료:",
                    registration.scope
                );

            })
            .catch(function (error) {

                console.log(
                    "Service Worker 등록 실패:",
                    error
                );

            });

    });

}


/* =========================
   뒤로가기 시 화면 보정
========================= */

window.addEventListener("pageshow", function (event) {

    if (event.persisted) {
        window.scrollTo(0, 0);
    }

});

</script>
